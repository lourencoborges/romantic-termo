<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#180f15">
  <meta name="description" content="Um jogo de palavras feito com amor, para jogar juntinhos. Uma surpresa nova por dia.">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Palavras de Amor">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script src="./portuguese-words.js" defer></script>
  <script src="./app.js" defer></script>
  <title>Palavras de Amor</title>
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <a class="brand" href="/" aria-label="Palavras que me lembram você, M">
        <span class="brand-name">Palavras que me lembram você, M</span>
      </a>
      <button id="mode-menu-toggle" class="mode-menu-toggle" type="button" aria-label="Abrir modos de jogo" aria-expanded="false" aria-controls="levels">
        <span id="mode-menu-arrow" aria-hidden="true">↓</span>
      </button>
      <div class="header-tools">
        <button id="install-button" class="install-button" type="button" hidden>Instalar</button>
      </div>
    </div>
    <nav id="levels" class="mode-tabs" aria-label="Modo de jogo" aria-hidden="true"></nav>
  </header>

  <main class="app-shell">
    <section class="game-card" aria-label="Jogo Palavras de Amor">
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <section id="board-wrap" class="board-wrap" aria-label="Tabuleiros do desafio"><div id="boards" class="boards"></div></section>
      <div id="keyboard" class="keyboard" aria-label="Teclado virtual"></div>
      <p class="keyboard-hint" id="keyboard-hint">Toque numa casa para escolher a posição e depois digite a letra</p>
      <section id="love-note" class="love-note" hidden aria-live="polite">
        <div><p class="note-kicker">UM BILHETINHO PRA VOCÊ</p><p id="love-note-text" class="note-text"></p></div>
      </section>
      <div id="stage-transition" class="stage-transition" hidden>
        <button id="next-stage-button" class="next-stage-button" type="button">
          <span id="next-stage-label">Ir para Dueto</span><span class="next-stage-arrow" aria-hidden="true">→</span>
        </button>
      </div>
      <div id="share-row" class="share-row" hidden><button id="share-button" class="share-button" type="button"><span aria-hidden="true">↗</span> Compartilhar nosso resultado</button></div>
    </section>
    <div class="reset-actions">
      <button id="reset-game-button" class="reset-game-button" type="button">Reiniciar desafio de hoje</button>
    </div>
  </main>

  <noscript><p class="noscript">Este joguinho precisa de JavaScript para funcionar. Ative-o no navegador e tente de novo. ♥</p></noscript>
</body>
</html>
